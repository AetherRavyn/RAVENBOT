[package]
name = "ravenbot"
version = "0.2.0"
description = "RAVENBOT - A Sovereign, Local-First, Rust-Native Multi-Agent Desktop OS"
authors = ["you"]
edition = "2021"
license.workspace = true

[lib]
name = "ravenbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# RAVENBOT crates
ravenbot-core = { path = "../crates/core" }
ravenbot-db = { path = "../crates/db" }
ravenbot-models = { path = "../crates/models" }
ravenbot-runtime = { path = "../crates/runtime" }
ravenbot-scheduler = { path = "../crates/scheduler" }
ravenbot-sync = { path = "../crates/sync" }
ravenbot-governance = { path = "../crates/governance" }
ravenbot-plugins = { path = "../crates/plugins" }
ravenbot-mcp = { path = "../crates/mcp" }
ravenbot-sandbox = { path = "../crates/sandbox" }
ravenbot-vision = { path = "../crates/vision" }
ravenbot-ipc = { path = "../crates/ipc" }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json"] }

# Keychain
keyring = "3"

# Window management
tauri-plugin-window-state = "2"

# HTTP for OpenAPI import
reqwest = { version = "0.12", features = ["json"] }

# Base64 for voice (audio in/out over IPC)
base64 = "0.22"

# Linux: enable microphone/media-stream so the UI can record voice input.
# WebKitGTK disables it by default and Wry does not expose the setting.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[dev-dependencies]
# The allowlist in office_org is checked against the real skill registry, so a
# skill that exists but is not listed (or the reverse) fails a test rather than
# quietly making a tool impossible to give an agent.
ravenbot-skills = { path = "../crates/skills" }
