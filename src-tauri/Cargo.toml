[package]
name = "ravenbot"
version = "0.2.0"
description = "RAVENBOT - A Sovereign, Local-First, Rust-Native Multi-Agent Desktop OS"
authors = ["you"]
edition = "2021"
license.workspace = true

[lib]
name = "ravenbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# RAVENBOT crates
ravenbot-core = { path = "../crates/core" }
ravenbot-db = { path = "../crates/db" }
ravenbot-models = { path = "../crates/models" }
ravenbot-runtime = { path = "../crates/runtime" }
ravenbot-memory = { path = "../crates/memory" }
ravenbot-scheduler = { path = "../crates/scheduler" }
ravenbot-sync = { path = "../crates/sync" }
ravenbot-governance = { path = "../crates/governance" }
ravenbot-plugins = { path = "../crates/plugins" }
ravenbot-mcp = { path = "../crates/mcp" }
ravenbot-skills = { path = "../crates/skills" }
ravenbot-sandbox = { path = "../crates/sandbox" }
ravenbot-vision = { path = "../crates/vision" }

ravenbot-remote = { path = "../crates/remote" }

# Tauri
# `unstable` unlocks `Window::add_child`, which is how the browser dock is a
# real child webview instead of an iframe that remote sites refuse to load.
tauri = { version = "2", features = ["unstable", "protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
notify-rust = "4"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# SMTP attention alerts. Default features include STARTTLS + native-tls.
lettre = "0.11"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand.workspace = true

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json"] }

# Keychain
keyring = "3"

# Window management
tauri-plugin-window-state = "2"
# WhatsApp Cloud API webhook receiver and HMAC verification.
axum = "0.8"
hmac = "0.12"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
subtle = "2"
# Slack Socket Mode uses a WebSocket; rustls avoids the OpenSSL toolchain.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "url"] }
futures.workspace = true

# One fleet owner (desktop or headless daemon) at a time.
fs2 = "0.4"

# HTTP for OpenAPI import
reqwest = { version = "0.12", features = ["json"] }

# Base64 for voice (audio in/out over IPC)
base64 = "0.22"

# Content hashes for workspace editor conflict detection
sha2 = "0.10"

# Async trait for the remote account authenticator
async-trait = "0.1"

# Linux: enable microphone/media-stream so the UI can record voice input.
# WebKitGTK disables it by default and Wry does not expose the setting.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
# Tauri's child webviews are packed into the window's vertical box on Linux,
# which shrinks the app instead of overlaying it. The dock is reparented into
# a GtkOverlay/GtkFixed so it can float above the main webview at measured
# bounds, matching what `add_child` does natively on Windows and macOS.
gtk = "0.18"
# `to_json` on the WebKit JS value is a javascriptcore-rs trait method.
javascriptcore-rs = "1.1"

[dev-dependencies]
plist = "1"
# The thread-goal end-to-end test implements ModelProviderTrait directly so a
# persisted goal can be exercised without a network provider.
async-trait = "0.1"
# The allowlist in office_org is checked against the real skill registry, so a
# skill that exists but is not listed (or the reverse) fails a test rather than
# quietly making a tool impossible to give an agent.
