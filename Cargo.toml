[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/runtime",
    "crates/models",
    "crates/skills",
    "crates/plugins",
    "crates/mcp",
    "crates/vision",
    "crates/sandbox",
    "crates/memory",
    "crates/scheduler",
    "crates/governance",
    "crates/sync",
    "crates/ipc",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json"] }
sqlite-vec = "0.1"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# JSON Schema validation
jsonschema = "0.24"

# Crypto / signing
ed25519-dalek = "2"
base64 = "0.22"

# WASM runtime
wasmtime = "28"

# OS keychain
keyring = "3"

# Random
rand = "0.8"

# Freq
futures = "0.3"

# Process management
nix = { version = "0.29", features = ["signal"] }

# Specta for TypeScript generation
specta = { version = "2.0.0-rc.25", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.dev]
# Faster incremental builds for development
opt-level = 0

# Cargo config for binary size and startup
[profile.release.package.ravenbot-core]
opt-level = "z"

