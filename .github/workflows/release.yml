name: Release

# Builds the three installers people actually ask for and attaches them to a
# GitHub Release:
#   Linux   -> .AppImage, .deb, .rpm
#   macOS   -> .dmg (universal: arm64 + x86_64)
#   Windows -> .exe (NSIS), .msi (WiX)
#
# Tagged pushes only. The tag must point at a commit that contains this file,
# because Actions reads workflows from the tagged ref.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            # 22.04 rather than 24.04: the AppImage links an older glibc, so the
            # artifact runs on more distros.
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # beforeBuildCommand is `bun run build`, so the toolchain that produced
      # the lockfile has to be the one CI installs.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: bun install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libdbus-1-dev is not optional: `keyring` pulls in `libdbus-sys`,
          # whose build script runs pkg-config and fails without it.
          # libpipewire/libspa are xcap 0.5+'s Linux capture backend and are
          # an unconditional target dependency — pkg-config fails at
          # `libpipewire-0.3 >= 0.3` without them — with libclang behind the
          # bindgen those -sys crates run. SQLite needs no -dev package:
          # `libsqlite3-sys` compiles its own sqlite3.c.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            patchelf \
            libfuse2 \
            libssl-dev

      - name: Build installers and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RAVENBOT ${{ github.ref_name }}"
          releaseBody: |
            RAVENBOT ${{ github.ref_name }} — sovereign, local-first, Rust-native multi-agent desktop OS.

            ### Install

            | Platform | File |
            | --- | --- |
            | Linux | `RAVENBOT_*.AppImage` (chmod +x, then run), `*.deb`, `*.rpm` |
            | macOS | `RAVENBOT_*.dmg` (drag **RAVENBOT** into Applications) |
            | Windows | `RAVENBOT_*.exe` (NSIS installer) or `*.msi` (WiX) |

            **Linux:** the AppImage needs FUSE (`sudo apt install libfuse2`).
            **macOS:** this build is unsigned — right-click → Open the first time,
            or `xattr -dr com.apple.quarantine /Applications/RAVENBOT.app`.
            **Windows:** SmartScreen may warn on an unsigned exe — "More info" →
            "Run anyway".

            Verify downloads against `SHA256SUMS.txt`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The three matrix jobs upload concurrently, so the release can still
          # be filling up. Poll until all six installers have landed.
          expected=6
          mkdir -p assets
          for i in $(seq 1 30); do
            rm -rf assets && mkdir -p assets
            gh release download "${GITHUB_REF_NAME}" --dir assets 2>/dev/null || true
            n=$(find assets -type f ! -name 'SHA256SUMS.txt' | wc -l)
            echo "attempt ${i}: ${n}/${expected} installers present"
            [ "${n}" -ge "${expected}" ] && break
            sleep 20
          done

          cd assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt

          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt

          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber
