name: CI

# Note: this repo's default branch is `master`, not `main` — the trigger below
# has to match it or the workflow never runs.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: nothing in this workflow writes. `security-events: write`
# used to be here for rustsec/audit-check, which uploads SARIF to code
# scanning — but this repo has never had code scanning enabled (the alerts
# endpoint answers "no analysis found"), so every run died on "Resource not
# accessible by integration" before auditing a single crate, and no token
# scope can fix that. The audit reports to the log now, so the scope is dead.
permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # src-tauri is a workspace member, so `cargo test --workspace` links the
      # Tauri crates and needs GTK/WebKit headers present. libdbus-1-dev is
      # required by `keyring` -> `libdbus-sys`, whose build script runs
      # pkg-config — and by xcap's Linux `dbus` dependency. bubblewrap is what
      # the sandbox tests actually assert against: without it they all skip and
      # CI proves nothing about isolation.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            libfuse2 \
            libssl-dev

      - name: Run tests
        run: cargo test --workspace

      # The Docker tier is a real container backend, not a fallback. Run the
      # live test here so a change that breaks mounts, limits, or network
      # isolation fails CI instead of only a manual check.
      - name: Docker sandbox live test
        run: |
          docker pull alpine:3.20
          cargo test -p ravenbot-sandbox --lib docker_tier_runs_in_a_real_isolated_container -- --ignored --nocapture

      # Report-only for now. The workspace carries a known clippy baseline, so
      # `-D warnings` would keep this job red until that debt is cleared — a
      # permanently failing gate teaches people to ignore CI. Tightening this
      # to `-D warnings` is the follow-up once the baseline is at zero.
      - name: Clippy (report)
        run: cargo clippy --workspace --all-targets

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: bun install

      - name: Frontend checks (typecheck + UI gate + tests)
        run: |
          bun run check
          bun run test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Advisory/license findings shouldn't block a merge on their own — they are
    # surfaced here for a human to triage. Flip this to `false` once the
    # advisory backlog is cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Run cargo-audit directly rather than through rustsec/audit-check: that
      # action's whole job is writing SARIF to a code-scanning service this
      # repo has never enabled, so it failed with a permission error before it
      # produced any findings. The findings are what we want, and the log is a
      # perfectly good place for them.
      - name: Run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # `!cancelled()` so a RustSec advisory cannot silence the licence/ban
      # report — the two checks answer different questions, and both belong to
      # the triage this job exists to surface.
      - name: Run cargo-deny
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check all

  # The Linux job executes the real systemd service. These jobs compile and run
  # the unit/task/account contracts on macOS and Windows, where launchd and Task
  # Scheduler cannot be exercised safely from a hosted runner. They catch the
  # platform-specific rendering and path regressions that Linux cannot.
  platform-contracts:
    name: Platform contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Service unit contracts
        run: cargo test -p ravenbot --lib service::tests

      - name: Account contracts
        run: cargo test -p ravenbot --lib accounts::tests

      - name: Account environment handoff
        run: cargo test -p ravenbot --test accounts_env

      # The platform contract tests assert the two things a build matrix cannot:
      # Windows refuses to run an unsandboxed agent command, and macOS Seatbelt
      # really denies network and outside-workspace reads. The live Seatbelt
      # test is ignored by default because it needs a real macOS host; this job
      # is that host.
      - name: Sandbox platform contract
        run: cargo test -p ravenbot-sandbox platform_contract_tests -- --nocapture

      - name: Live Seatbelt contract
        if: runner.os == 'macOS'
        run: cargo test -p ravenbot-sandbox platform_contract_tests -- --ignored --nocapture
