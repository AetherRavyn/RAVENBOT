name: CI

# Note: this repo's default branch is `master`, not `main` — the trigger below
# has to match it or the workflow never runs.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# rustsec/audit-check uploads a SARIF file; without `security-events: write`
# the job fails with "Resource not accessible by integration" regardless of
# what the audit found.
permissions:
  contents: read
  security-events: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # src-tauri is a workspace member, so `cargo test --workspace` links the
      # Tauri crates and needs GTK/WebKit headers present. libdbus-1-dev is
      # required by `keyring` -> `libdbus-sys`, whose build script runs
      # pkg-config. libpipewire/libspa are xcap 0.5+'s Linux capture backend —
      # an unconditional target dependency, so pkg-config fails without them —
      # and libclang backs the bindgen those -sys crates run.
      # bubblewrap is what the sandbox tests actually assert against: without
      # it they all skip and CI proves nothing about isolation.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            patchelf \
            libfuse2 \
            libssl-dev

      - name: Run tests
        run: cargo test --workspace

      # Report-only for now. The workspace carries a known clippy baseline, so
      # `-D warnings` would keep this job red until that debt is cleared — a
      # permanently failing gate teaches people to ignore CI. Tightening this
      # to `-D warnings` is the follow-up once the baseline is at zero.
      - name: Clippy (report)
        run: cargo clippy --workspace --all-targets

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: bun install

      - name: Frontend checks (typecheck + tests)
        run: |
          bun run check
          bun run test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Advisory/license findings shouldn't block a merge on their own — they are
    # surfaced here for a human to triage. Flip this to `false` once the
    # advisory backlog is cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check all
