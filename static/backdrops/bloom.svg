<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bloom">
  <defs>
    <radialGradient id="bloom-bg" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#2a1028"/>
      <stop offset=".65" stop-color="#160b1a"/>
      <stop offset="1" stop-color="#08050c"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="petal-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity=".02"/>
    </linearGradient>
    <filter id="bloom-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bloom-bg)"/>
  <g filter="url(#bloom-soft)" transform="translate(1080 430)">
    <g fill="url(#petal)">
      <ellipse rx="120" ry="330" transform="rotate(0)"/>
      <ellipse rx="120" ry="330" transform="rotate(45)"/>
      <ellipse rx="120" ry="330" transform="rotate(90)"/>
      <ellipse rx="120" ry="330" transform="rotate(135)"/>
    </g>
    <g fill="url(#petal-2)" transform="rotate(22.5)">
      <ellipse rx="92" ry="250"/>
      <ellipse rx="92" ry="250" transform="rotate(45)"/>
      <ellipse rx="92" ry="250" transform="rotate(90)"/>
      <ellipse rx="92" ry="250" transform="rotate(135)"/>
    </g>
    <circle r="54" fill="#f9a8d4" opacity=".22"/>
  </g>
  <g fill="#f9a8d4" opacity=".35">
    <circle cx="250" cy="210" r="2"/>
    <circle cx="430" cy="610" r="1.5"/>
    <circle cx="680" cy="150" r="1.4"/>
    <circle cx="900" cy="740" r="1.8"/>
    <circle cx="1330" cy="180" r="1.6"/>
    <circle cx="1420" cy="700" r="2"/>
  </g>
  <rect width="1600" height="900" fill="#08050c" opacity=".2"/>
</svg>
