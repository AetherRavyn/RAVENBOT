<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aurora">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b1d"/>
      <stop offset="1" stop-color="#0a1b2b"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".35" stop-color="#34d399" stop-opacity=".32"/>
      <stop offset=".65" stop-color="#38bdf8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".18"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="240%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <path d="M-120 560 C 260 330, 520 660, 900 420 S 1500 520, 1760 330" fill="none" stroke="url(#ribbon)" stroke-width="150"/>
    <path d="M-80 700 C 320 520, 620 760, 980 560 S 1460 650, 1740 470" fill="none" stroke="url(#ribbon2)" stroke-width="90"/>
  </g>
  <g fill="#e2f8ff" opacity=".5">
    <circle cx="180" cy="150" r="2"/>
    <circle cx="420" cy="96" r="1.4"/>
    <circle cx="760" cy="190" r="1.6"/>
    <circle cx="1120" cy="120" r="1.3"/>
    <circle cx="1390" cy="220" r="2"/>
    <circle cx="980" cy="70" r="1.2"/>
    <circle cx="300" cy="300" r="1.1"/>
    <circle cx="1280" cy="330" r="1.5"/>
  </g>
  <rect width="1600" height="900" fill="#050b1d" opacity=".12"/>
</svg>
