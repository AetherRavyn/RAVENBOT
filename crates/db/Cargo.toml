[package]
name = "ravenbot-db"
description = "RAVENBOT database layer with SQLite and migrations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ravenbot-core = { path = "../core" }
sqlx.workspace = true
# sqlx accepts libsqlite3-sys >=0.30.1,<0.41. Pin the bundled SQLite past
# 3.54.0 so RUSTSEC-2026-0459 is closed for every member that links this crate.
libsqlite3-sys = { version = "0.39", features = ["bundled"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
keyring.workspace = true
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand.workspace = true
